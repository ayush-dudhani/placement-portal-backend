version: '3.8'

services:

  postgres:
    image: postgres:17
    container_name: placement-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: placementdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

  redis:
    image: redis:latest
    container_name: placement-redis
    ports:
      - "6379:6379"