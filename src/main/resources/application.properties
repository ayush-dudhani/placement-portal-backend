spring.application.name=placement-portal
server.port=${PORT:8080}

#Actuator related endpoints
management.endpoints.web.exposure.include=health,info
management.info.git.mode=full

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/placementdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_schema=public

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.username=${SPRING_DATA_REDIS_USERNAME}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD}
spring.data.redis.ssl.enabled=true
#spring.data.redis.url=rediss://default:${SPRING_DATA_REDIS_PASSWORD}@${SPRING_DATA_REDIS_HOST}:${SPRING_DATA_REDIS_PORT}

jwt.secret=${JWT_SECRET}
#in milliseconds, e.g., 3600000 for 1 hour
jwt.expiration=${JWT_EXPIRATION}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS