spring.application.name=placement-portal
server.port=${PORT:8080}
management.endpoints.web.exposure.include=health,info
management.info.git.mode=full

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/placementdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Redis is the access-session authority, distributed rate-limit store and read cache.
# Disable only for isolated tests/development that intentionally uses the in-memory fallback.
app.redis.enabled=${APP_REDIS_ENABLED:true}
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.username=${SPRING_DATA_REDIS_USERNAME:}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${SPRING_DATA_REDIS_SSL_ENABLED:true}
spring.data.redis.connect-timeout=${SPRING_DATA_REDIS_CONNECT_TIMEOUT:30s}
spring.data.redis.timeout=${SPRING_DATA_REDIS_TIMEOUT:30s}
spring.data.redis.repositories.enabled=false
management.health.redis.enabled=${APP_REDIS_ENABLED:true}
spring.cache.type=redis
spring.cache.redis.time-to-live=${SPRING_CACHE_REDIS_TTL:60s}
spring.cache.redis.cache-null-values=false

jwt.secret=${JWT_SECRET:change-this-development-key-before-production-0123456789}
jwt.expiration=${JWT_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:2592000000}
auth.refresh-cookie-secure=${AUTH_REFRESH_COOKIE_SECURE:false}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
storage.local.root=${STORAGE_LOCAL_ROOT:${java.io.tmpdir}/placement-portal-objects}
storage.max-file-size=${STORAGE_MAX_FILE_SIZE:5242880}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
springdoc.swagger-ui.path=/swagger-ui.html
