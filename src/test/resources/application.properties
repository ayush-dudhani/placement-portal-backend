jwt.secret=test-jwt-secret-for-tests-that-is-at-least-32-bytes
jwt.expiration=900000
jwt.refresh-expiration=2592000000
spring.datasource.url=jdbc:h2:mem:placement;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false
spring.data.jpa.repositories.enabled=true
app.redis.enabled=false
spring.cache.type=simple
auth.refresh-cookie-secure=false
cors.allowed-origins=http://localhost:5173
cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
storage.local.root=${java.io.tmpdir}/placement-portal-test-objects


